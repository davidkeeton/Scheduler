services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scheduler
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-alpha-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: scheduler
      DB_USER: scheduler
      DB_PASSWORD: ${DB_PASSWORD:-local-alpha-only}
      ALPHA_AUTO_ADMIN: "1"
      APP_ENV: alpha
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-alpha-secret-change-before-sharing}
    depends_on:
      db:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "${WEB_BIND:-127.0.0.1}:8080:80"
    depends_on:
      - api
volumes:
  postgres_data:
